{% extends "base.html" %}
{% block titulo %}Materiais{% endblock %}

{% block conteudo %}

<div class="mb-8">
  <h1 class="text-2xl font-semibold text-white tracking-tight">Repositório de Materiais</h1>
  <p class="text-slate-500 text-sm mt-1">E-books, PDFs e arquivos da sua mentoria</p>
</div>

<div class="grid md:grid-cols-2 gap-4">
  {% for m in materiais %}
  <a href="{{ m.link }}" target="_blank"
     class="flex items-center justify-between bg-panel border border-border rounded-xl p-5 hover:border-slate-500 transition group">
    <div>
      <p class="text-sm text-white font-medium">{{ m.titulo }}</p>
      <p class="text-xs text-slate-500 mt-1">{{ m.tipo }}</p>
    </div>
    <span class="text-accent2 group-hover:text-white transition">⬇</span>
  </a>
  {% else %}
  <p class="text-sm text-slate-600">Nenhum material disponível ainda.</p>
  {% endfor %}
</div>

{% endblock %}
