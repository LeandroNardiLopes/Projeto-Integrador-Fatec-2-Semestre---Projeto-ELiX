{% extends "base.html" %}
{% block titulo %}Login{% endblock %}

{% block conteudo %}
<div class="min-h-[75vh] flex items-center justify-center">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-accent to-accent2 flex items-center justify-center font-bold text-white text-2xl mb-4">E</div>
      <h1 class="text-2xl font-semibold text-white tracking-tight">Elix</h1>
      <p class="text-slate-500 text-sm mt-1">Mentoria em Comunicação Profissional Bilíngue</p>
    </div>

    <form method="POST" class="bg-panel border border-border rounded-xl p-6 space-y-4 shadow-2xl shadow-black/40">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">E-mail</label>
        <input type="email" name="email" required autofocus placeholder="seu@email.com"
          class="w-full bg-panel2 border border-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-600
                 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5">Senha</label>
        <input type="password" name="senha" required placeholder="••••••••"
          class="w-full bg-panel2 border border-border rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-600
                 focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition">
      </div>
      <button type="submit"
        class="w-full bg-accent hover:bg-accent2 text-white font-medium rounded-lg py-2.5 text-sm transition shadow-lg shadow-accent/20">
        Entrar
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-600 space-y-1">
      <p>Contas de exemplo (senha: <span class="text-slate-400 font-mono">123456</span>)</p>
      <p class="font-mono text-slate-500">professor@elix.com · carlos@aluno.com · juliana@aluno.com</p>
    </div>

  </div>
</div>
{% endblock %}
